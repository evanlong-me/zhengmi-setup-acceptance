name: prod-setup-acceptance

on:
  workflow_dispatch:
  push:

env:
  ZHENGMI_API_KEY: sk-prod-accept-000000
  ZHENGMI_BASE_URL: http://106.54.47.97

jobs:
  # 生产网关脚本：Linux 覆盖全部 11 个工具
  gateway-linux:
    name: ubuntu / ${{ matrix.tool }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        tool: [claude, claude-desktop, codex, gemini, opencode, hermes, pi, openclaw, codebuddy, kilo, cline]
    steps:
      - uses: actions/checkout@v4
      - name: 文档命令执行生产脚本
        env:
          TOOL: ${{ matrix.tool }}
        run: |
          curl -fsSL "http://106.54.47.97/api/setup-scripts/$TOOL.sh" -o /tmp/zs.sh
          echo "版本: $(grep -m1 -oE "SETUP_VERSION='[0-9]+'" /tmp/zs.sh)"
          bash /tmp/zs.sh --yes
      - name: 校验配置指向生产网关
        env:
          TOOL: ${{ matrix.tool }}
        run: python3 verify/verify_posix.py

  # 生产网关脚本：macOS 覆盖全部 11 个工具（bash 3.2 / macOS 路径）
  gateway-macos:
    name: macos / ${{ matrix.tool }}
    runs-on: macos-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        tool: [claude, claude-desktop, codex, gemini, opencode, hermes, pi, openclaw, codebuddy, kilo, cline]
    steps:
      - uses: actions/checkout@v4
      - name: 文档命令执行生产脚本
        env:
          TOOL: ${{ matrix.tool }}
        run: |
          curl -fsSL "http://106.54.47.97/api/setup-scripts/$TOOL.sh" -o /tmp/zs.sh
          echo "版本: $(grep -m1 -oE "SETUP_VERSION='[0-9]+'" /tmp/zs.sh)"
          bash /tmp/zs.sh --yes
      - name: 校验配置指向生产网关
        env:
          TOOL: ${{ matrix.tool }}
        run: python3 verify/verify_posix.py

  # Windows：文档命令 irm | iex，覆盖全部 11 个工具
  gateway-windows:
    name: windows / ${{ matrix.tool }} / iex
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        tool: [claude, claude-desktop, codex, gemini, opencode, hermes, pi, openclaw, codebuddy, kilo, cline]
    steps:
      - uses: actions/checkout@v4
      - name: 文档命令 irm | iex（PS 5.1）
        shell: powershell
        run: |
                    irm http://106.54.47.97/api/setup-scripts/${{ matrix.tool }}.ps1 | iex
      - name: 校验配置指向生产网关
        shell: powershell
        env:
          TOOL: ${{ matrix.tool }}
        run: |
          $env:PYTHONUTF8 = "1"
          python verify/verify_windows.py

  # 存盘执行路径：确认下载成文件后（BOM/ANSI 解析）也能写对配置
  saved-file:
    name: saved-file / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: 下载成文件后执行 kilo
        shell: bash
        run: |
          ext=sh; [ "${{ matrix.os }}" = "windows-latest" ] && ext=ps1
          curl -fsSL "http://106.54.47.97/api/setup-scripts/kilo.$ext" -o "zs.$ext"
          echo "首 3 字节: $(head -c 3 "zs.$ext" | od -An -tx1 | tr -d ' \n')"
          if [ "$ext" = "ps1" ]; then
            powershell -NoProfile -Command "& './zs.ps1' --yes"
          else
            bash "zs.$ext" --yes
          fi
      # Windows 走 ps1/PS 路径，必须用 Windows 版校验（posix 版不认识 APPDATA 与 .exe 后缀）
      - name: 校验配置
        shell: bash
        env:
          TOOL: kilo
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then python verify/verify_windows.py; else python3 verify/verify_posix.py; fi

  # CDN 镜像：文档里的通用脚本命令
  cdn:
    name: cdn / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: CDN 通用脚本（文档命令形式）
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            curl -fsSL https://s3.chatbot.js.cn/ai-zhengmi-docs/setup/zhengmi-setup.ps1 -o zs.ps1
            powershell -NoProfile -Command "\$env:ZHENGMI_SETUP_TOOL='kilo'; & './zs.ps1' --yes"
          else
            curl -fsSL https://s3.chatbot.js.cn/ai-zhengmi-docs/setup/zhengmi-setup.sh \
              | bash -s -- kilo --base-url http://106.54.47.97 --yes
          fi
      - name: 校验配置
        shell: bash
        env:
          TOOL: kilo
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then python verify/verify_windows.py; else python3 verify/verify_posix.py; fi
